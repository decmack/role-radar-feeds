name: Pull feeds
on:
  schedule:
    - cron: '0 12 * * *'   # 23:00 Sydney (AEDT) / 22:00 (AEST) 
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pull-feeds
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest tests.test_radar
      - run: python3 radar.py
      - name: Commit results
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add latest.json state/seen.json
          git diff --cached --quiet || git commit -m "Feed pull $(date -u +%F)"
          git push
